name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: "18.13.1"
  NODE_VERSION: "22"

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use stable SemVer format X.Y.Z." >&2
            exit 1
          fi

          if [[ "${version}" == "0.0.0" ]]; then
            echo "Version 0.0.0 is not a publishable Android version." >&2
            exit 1
          fi
          version_code=$((1000000000 + 10#${WORKFLOW_RUN_NUMBER}))
          if (( version_code > 2100000000 )); then
            echo "GitHub run number exceeds Android's versionCode limit." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

  android-apk:
    name: Build Android APK locally
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TODEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      TODEX_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        env:
          # heroui-native-pro ships its component sources via an authenticated
          # postinstall; install with scripts disabled, fetch the Pro artifacts
          # with the license key, then run the remaining native build scripts.
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          npm ci --ignore-scripts
          if [ -z "$HEROUI_KEY" ]; then
            echo "HEROUI_KEY secret is not configured; heroui-native-pro cannot be installed." >&2
            exit 1
          fi
          npx -y hpsetup@latest "$HEROUI_KEY"
          npm rebuild

      - name: Validate application
        run: |
          npm run typecheck
          npm test
          npm run check:protocol

      - name: Verify injected version
        shell: bash
        run: |
          node -e 'const base = require("./app.json").expo; const resolved = require("./app.config")({ config: base }); if (resolved.version !== process.env.TODEX_BUILD_VERSION || resolved.extra?.todexBuildVersion !== process.env.TODEX_BUILD_VERSION) { throw new Error(`Version injection failed: ${JSON.stringify({ version: resolved.version, displayVersion: resolved.extra?.todexBuildVersion })}`); }'

      - name: Install EAS CLI
        run: npm install --global eas-cli@${EAS_CLI_VERSION}

      - name: Build APK on the runner
        run: |
          mkdir -p dist
          eas build \
            --local \
            --non-interactive \
            --freeze-credentials \
            --platform android \
            --profile local-apk \
            --output "dist/TodeX-v${TODEX_BUILD_VERSION}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TodeX-v${{ needs.prepare.outputs.version }}-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - android-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksum
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS

      - name: Create and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --draft

          cleanup() {
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          }
          trap cleanup ERR

          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"
          find dist -maxdepth 1 -type f -exec basename {} \; | sort > expected-assets.txt
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt

          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          trap - ERR
